[workspace]
members = [".", "crates/ox-fs", "crates/ox-settings"]
resolver = "2"

[package]
name = "oxide-text"
version = "0.0.0"
edition = "2021"
description = "An open source text editor for Markdown documents"
license = "UNLICENSED"

[lib]
name = "oxide_text_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ox-fs = { path = "crates/ox-fs" }
ox-settings = { path = "crates/ox-settings" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
